meta:
  name: humanizer
  version: "1.0.0"
  description: >-
    Delegates AI prose humanization and de-slopping to the local Humanizer skill
    package without duplicating its upstream pattern catalog. Use this skill
    whenever editing, rewriting, or reviewing prose to remove AI tells such as
    not-X-but-Y contrasts, one-line closers, staged run-ups, forced triads,
    universal em dashes, inflated claims, sales language, overused AI words, or
    chatbot residue.
  tags:
    - writing
    - humanizer
    - editing
    - prose
    - style
  author: TuanHalo
  created: "2026-11-14"
  updated: "2026-11-14"

