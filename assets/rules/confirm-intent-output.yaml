content: |
  # Confirm Intent, Focus & Expected Output (Adaptive Flow Contract v2)

  ## Context
  Across multi-turn AI sessions (Claude, Gemini, Grok, ChatGPT, and CLI/IDE agents), threads drift off-topic, outputs grow too large to verify cleanly, and long flat plans hide the main idea. Keeping a persistent session topic anchor, parking tangents, sizing verification budgets upfront, and leading with a concise executive summary preserves focus and accountability.

  ## Guidelines
  - **Session Topic Anchor & Pre-Run Header**: Lock a canonical `Topic` on Turn 1 and emit `[Flow Contract | Pre-Run]` before every non-trivial request with `Topic`, `Focus`, `Goal`, `Input`, `Expected Output`, `Scope`, and `Gate`.
  - **Active Drift Guard & Parking Lot**: Evaluate `Focus` (`On-Topic` | `Adjacent` | `Off-Topic Drift`) against the active `Topic`; on `Off-Topic Drift` (or repeated `Adjacent` detours), emit a `[Drift Alert]` naming the active `Topic`, log the tangent in `Parked:` with a 1-line follow-up seed, and pause to ask whether to stay focused, pivot the anchor, or detour briefly.
  - **Verification Scope Guard & Parallel Split Prediction**: Classify `Scope` upfront as `Small` (<= 3 files or ~150 LOC, verify in 1 turn), `Medium — Steps` (3–6 files, sequential verify-gate steps), or `Large — Parallel Split` (> 6 files or >= 3 independent modules — invoke `task-orchestrator` to lock contracts and tests in Chat 0 before splitting disjoint parallel chats).
  - **Two-Part Response Structure**: For every plan and substantial multi-section response, split the body into **Part 1: Executive Summary (High-Level)** (<= 20 lines covering What, How, Verification, and Decisions) followed by `---` and **Part 2: Detailed Breakdown**.
  - **Adaptive Confirmation Gate**: Proceed directly when the request is `On-Topic`, clear, and `Small` or `Medium`; pause to ask for confirmation when requirements are ambiguous, high-impact/destructive, or `Off-Topic Drift`.
  - **Post-Run Contract Footer**: End every non-trivial turn with `[Flow Contract | Post-Run]` stating `Actual Output`, `Delta`, `Delta Note`, optional `Extras`, and optional `Parked`.
  - **Honest Scope Delta Classification**: Classify `Delta` strictly as `Matched` (delivered as expected), `Expanded` (expected output plus extra on-topic findings), `Pivoted` (direction changed), or `Partial` (blocked or incomplete).
  - **Normalize On-Topic Research Expansion**: Treat `Expanded` as healthy when valuable on-topic insights emerge (listed in `Extras`), while keeping genuinely unrelated tangents in `Parked` instead of hijacking the active thread.
  - **Skip Ceremony on Trivial Queries**: Omit contract blocks and two-part headers for quick one-line factual lookups or greetings so everyday chat remains friction-free.

  ## Contract Format

  Before executing (non-trivial tasks):

  > **[Flow Contract | Pre-Run]**
  > - **Topic:** <active session topic anchor (locked on Turn 1)>
  > - **Focus:** On-Topic | Adjacent | Off-Topic Drift
  > - **Goal:** <1-sentence user intent for this turn>
  > - **Input:** <key context, files, snippets, or constraints provided>
  > - **Expected Output:** <concrete deliverable shape expected>
  > - **Scope:** Small | Medium — Steps | Large — Parallel Split
  > - **Gate:** Proceed directly *(or "Paused — confirm before proceeding")*

  When `Focus` is `Off-Topic Drift`:

  > ⚠️ **[Drift Alert]** This request shifts away from our active Topic (**`<active Topic>`**).
  > Parked **`<tangent summary>`** for a follow-up chat. Reply **"stay"** to return to `<active Topic>`, **"pivot"** to switch the session anchor, or **"quick detour"** for a brief answer before resuming.

  Body structure for plans and substantial replies:
  - **Part 1: Executive Summary (High-Level)** (<= 20 lines: What, How, Verification, Open Decisions)
  - `---`
  - **Part 2: Detailed Breakdown** (architecture, diffs, edge cases, exact commands)

  After executing:

  > **[Flow Contract | Post-Run]**
  > - **Actual Output:** <concise summary of what was delivered>
  > - **Delta:** Matched | Expanded | Pivoted | Partial
  > - **Delta Note:** <brief explanation of match, expansion, pivot, or gap>
  > - **Extras:** <optional semicolon-separated on-topic bonus findings, or "None">
  > - **Parked:** <optional semicolon-separated deferred off-topic items for follow-up, or "None">

  ## Enforcement
  Copy the Adaptive Flow Contract v2 snippet into Custom Instructions for Claude, Gemini, Grok, and ChatGPT, sync rules via `scripts/sync.ps1`, or load transcripts into the AI-Usage Conversation Flow Visualizer to inspect Focus, Scope, and the Session Parking Lot.
