meta:
  name: typescript-standards
  version: "1.0.0"
  description: >-
    Enforces strict TypeScript standards, explicit type declarations, and safety
    guards across all TypeScript projects. Apply whenever writing or refactoring TypeScript code.
  scope: global
  priority: high
  tags:
    - typescript
    - quality
    - safety
    - standards

targets:
  antigravity:
    trigger: always_on
  cursor:
    alwaysApply: true
    globs: "**/*.ts,**/*.tsx"
  claude_code:
    scope: global
  gemini_cli:
    scope: global

content: |
  # TypeScript Standards

  ## Context
  Ensures consistent, safe, and maintainable TypeScript patterns across projects.

  ## Guidelines
  - **No Implicit Any**: Always maintain `strict: true` in tsconfig.
  - **Interfaces for Models**: Prefer `interface` for entity data shapes, reserving `type` for unions, intersections, and utility type expressions.
  - **Explicit Return Types**: All exported functions and methods must declare explicit return types.
  - **Unknown Over Any**: When type is dynamic or external, use `unknown` accompanied by type narrowing or Zod schemas.
  - **Immutability by Default**: Use `readonly` for array properties and immutable configs where appropriate.

  ## Enforcement
  Run `tsc --noEmit` and verify zero errors before committing code changes.
